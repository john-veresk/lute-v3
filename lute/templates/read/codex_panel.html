{% extends 'read/term_form_base.html' %}
{% block include_term_form %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/codex-panel.css') }}">
<main class="codex-panel" data-kind="{{ request.args.get('kind', 'sentence') }}">
  <header class="codex-head">
    <h2 id="codex-text"></h2>
    <div class="term-head-actions">
      <span class="codex-meta" title="{{ language.translation_source_name if language else 'Codex' }} model{% if language %}, translating into {{ language.translation_target }}{% endif %}">
        <span class="codex-model">{{ (language.codex_model or language.translation_source_name) if language else 'Codex' }}</span>
        {% if language and language.codex_show_timer %}<span id="codex-timer" role="timer" aria-live="off"></span>{% endif %}
      </span>
      <button id="codex-refresh" type="button" class="term-icon-btn" title="Translate again with {{ language.translation_source_name if language else 'Codex' }}" aria-label="Translate again with {{ language.translation_source_name if language else 'Codex' }}">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.2h-4.2"/></svg>
      </button>
    </div>
  </header>
  <div id="codex-lemma" class="codex-lemma"></div>
  <p id="codex-context" class="codex-context" hidden><span id="codex-context-before"></span><mark id="codex-context-word"></mark><span id="codex-context-after"></span></p>

  <p id="codex-status" class="codex-status" role="status" aria-live="polite"></p>
  <button id="codex-retry" type="button" class="btn" hidden>Retry</button>
  <div id="codex-skeleton" class="codex-skeleton" aria-hidden="true" hidden><span></span><span></span><span></span></div>
  <div id="codex-options" class="codex-options" role="group" aria-label="Translation"></div>
</main>
<script src="{{ url_for('static', filename='js/codex-panel.js') }}"></script>
<script>
  (() => {
    const params = new URLSearchParams(window.location.search);
    const panel = new CodexPanel({window, languageId: Number(params.get('language_id')), kind: params.get('kind') || 'sentence'});
    panel.setLookup(window.parent.LUTE_CODEX_SENTENCE || '', '');
    panel.start('auto');
  })();
</script>
{% endblock %}
