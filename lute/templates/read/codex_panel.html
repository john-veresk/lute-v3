{% extends 'read/term_form_base.html' %}
{% block include_term_form %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/codex-panel.css') }}">
<main class="codex-panel" data-kind="{{ request.args.get('kind', 'term') }}">
  <header class="codex-head">
    <h2 id="codex-text"></h2>
    <div class="codex-meta" title="Codex model{% if language %}, translating into {{ language.translation_target }}{% endif %}">
      {{ (language.codex_model or 'Codex') if language else 'Codex' }}{% if language and language.codex_show_timer %}<span id="codex-timer" role="timer" aria-live="off"></span>{% endif %}
    </div>
  </header>
  <div id="codex-lemma" class="codex-lemma"></div>
  <p id="codex-context" class="codex-context" hidden><span id="codex-context-before"></span><mark id="codex-context-word"></mark><span id="codex-context-after"></span></p>

  <p id="codex-status" class="codex-status" role="status" aria-live="polite"></p>
  <button id="codex-retry" type="button" class="btn" hidden>Retry</button>
  <div id="codex-skeleton" class="codex-skeleton" aria-hidden="true" hidden><span></span><span></span><span></span></div>
  <button id="codex-start" type="button" class="btn btn-primary" hidden>Translate with Codex</button>

  <div id="codex-options" class="codex-options" role="group" aria-label="Meanings"></div>

  <details id="codex-parent" class="codex-parent" hidden>
    <summary>
      <span class="codex-section-label">Base form</span>
      <strong id="codex-parent-text"></strong>
      <span id="codex-parent-choice" class="codex-parent-choice"></span>
    </summary>
    <div id="codex-parent-options" class="codex-options codex-options-compact" role="group" aria-label="Base form meanings"></div>
  </details>

  <section id="codex-phrases" class="codex-cards" hidden>
    <h3>Phrases</h3>
    <div id="codex-phrase-cards"></div>
    <div class="codex-cards-foot">
      <p id="codex-phrases-status" role="status" aria-live="polite"></p>
      <button id="codex-add-phrases" class="btn" type="button" disabled>Add selected</button>
    </div>
  </section>

  <section id="codex-words" class="codex-cards" hidden>
    <h3>Words</h3>
    <div id="codex-word-cards"></div>
    <div class="codex-cards-foot">
      <p id="codex-words-status" role="status" aria-live="polite"></p>
      <button id="codex-add-words" class="btn" type="button">Add selected</button>
    </div>
  </section>

  <div class="codex-spacer"></div>
  <footer id="codex-savebar" class="codex-savebar" hidden>
    <button id="codex-save" type="button" class="btn btn-primary">Save</button>
    <span class="codex-keys"><span><kbd>1</kbd>–<kbd>9</kbd> choose</span><span><kbd>Enter</kbd> save</span></span>
  </footer>
</main>
<script src="{{ url_for('static', filename='js/codex-panel.js') }}"></script>
{% endblock %}
